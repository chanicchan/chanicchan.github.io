<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High School Chemistry: Acid Strength & Dilution Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .beaker-gradient {
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(59,130,246,0.2) 100%);
        }
        
        .molecule-unit {
            transition: bottom 0.5s cubic-bezier(0.4, 0, 0.2, 1), left 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, transform 0.4s ease;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            width: 20px; 
            height: 20px;
        }
        
        :root {
            --h-size: 6px;
            --a-size: 10px;
        }

        .sphere-h-neutral {
            width: var(--h-size);
            height: var(--h-size);
            background-color: #94a3b8;
            border-radius: 50%;
            border: 0.5px solid #000000;
            z-index: 2;
        }
        
        .sphere-a-neutral {
            width: var(--a-size);
            height: var(--a-size);
            background-color: #cbd5e1;
            border-radius: 50%;
            border: 0.5px solid #000000;
            margin-left: -2px;
            z-index: 1;
        }

        .ion-h {
            width: var(--h-size);
            height: var(--h-size);
            background-color: #ef4444;
            border-radius: 50%;
            border: 0.5px solid #000000;
            position: absolute;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        .ion-a {
            width: var(--a-size);
            height: var(--a-size);
            background-color: #3b82f6;
            border-radius: 50%;
            border: 0.5px solid #000000;
            position: absolute;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        .neutral-view, .ionized-view {
            transition: opacity 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-5xl mx-auto">
        <header class="bg-white rounded-xl shadow-md p-6 mb-8 border-l-8 border-blue-600">
            <h1 class="text-3xl font-bold text-slate-800">Acid Ionization & Dilution Simulator</h1>
            <p class="text-slate-600 mt-2">Observe molecules ionizing in-place as you adjust strength (<i>K</i><sub>a</sub>) or concentration.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <!-- Step 1: Acid Type -->
                <section class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
                    <h2 class="text-lg font-semibold mb-4 text-blue-700">1. Select Acid Type</h2>
                    <div class="flex gap-4">
                        <button id="btnStrong" class="flex-1 py-2 px-4 rounded-lg font-medium border-2 border-blue-600 bg-blue-600 text-white transition-all">Strong Acid</button>
                        <button id="btnWeak" class="flex-1 py-2 px-4 rounded-lg font-medium border-2 border-blue-600 text-blue-600 hover:bg-blue-50 transition-all">Weak Acid</button>
                    </div>
                    
                    <div id="kaContainer" class="mt-6 hidden">
                        <label class="block text-sm font-medium text-slate-700 mb-1">
                            Strength of acid (Ionization constant <i>K</i><sub>a</sub>): <span id="kaValueDisplay" class="font-mono text-blue-600">0.0001</span>
                        </label>
                        <input type="range" id="kaSlider" min="-4" max="0" step="0.01" value="-4" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                    </div>
                </section>

                <!-- Step 2: Concentration Parameters -->
                <section class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
                    <h2 class="text-lg font-semibold mb-4 text-blue-700">2. Adjust Solution</h2>
                    
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-slate-700 mb-1">
                            Molarity (<i>M</i> = <i>n</i>/<i>V</i>): <span id="molarityDisplay" class="font-mono text-blue-600">1.00</span> mol/L
                        </label>
                        <input type="range" id="molaritySlider" min="0.1" max="5.0" step="0.01" value="1.0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-slate-700 mb-1">
                            Initial Moles (<i>n</i><sub>HA</sub>): <span id="molesDisplay" class="font-mono text-blue-600">1.0</span> mol
                        </label>
                        <input type="range" id="molesSlider" min="1.0" max="5.0" step="0.1" value="1.0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">
                            Volume (<i>V</i>): <span id="volDisplay" class="font-mono text-blue-600">1.00</span> L
                        </label>
                        <input type="range" id="volSlider" min="1.0" max="10.0" step="0.1" value="1.0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                    </div>
                </section>

                <div class="bg-blue-50 rounded-xl p-4 border border-blue-100 text-center">
                    <h3 id="equationHeader" class="font-bold text-blue-800 text-xs uppercase tracking-wider mb-2">Ionization</h3>
                    <div id="equationDisplay" class="font-mono text-lg bg-white p-3 rounded border border-blue-200 shadow-inner">
                        HA → H<sup>+</sup> + A<sup>–</sup>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-xl shadow-sm p-8 border border-slate-200 flex flex-col md:flex-row items-center gap-8">
                    <div class="flex flex-col items-center">
                        <div class="relative w-56 h-72 border-x-4 border-b-4 border-slate-300 rounded-b-3xl flex flex-col-reverse beaker-gradient overflow-hidden bg-slate-100 mb-4">
                            <div id="liquidLevel" class="bg-blue-400/30 w-full transition-all duration-500"></div>
                            <div id="moleculeCanvas" class="absolute inset-0"></div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-x-4 gap-y-2 bg-slate-50 p-3 rounded-lg border border-slate-200 text-[9px] font-bold uppercase tracking-wider">
                            <div class="flex items-center gap-2">
                                <div class="ion-h !static !relative !transform-none border-black"></div>
                                <span class="text-slate-700">H<sup>+</sup></span>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="ion-a !static !relative !transform-none border-black"></div>
                                <span class="text-slate-700">A<sup>–</sup></span>
                            </div>
                            <div class="flex items-center gap-2 col-span-2 mt-1 pt-1 border-t border-slate-200">
                                <div class="flex items-center">
                                    <div class="sphere-h-neutral"></div>
                                    <div class="sphere-a-neutral"></div>
                                </div>
                                <span class="text-slate-700">Neutral HA</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex-1 w-full space-y-6">
                        <div class="text-center md:text-left">
                            <span class="text-sm font-bold text-slate-400 uppercase tracking-widest">pH Level</span>
                            <div id="phDisplay" class="text-6xl font-black text-blue-600 transition-all">0.00</div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="p-3 bg-slate-50 rounded-lg border border-slate-200">
                                <span class="text-xs font-bold text-slate-500 uppercase">[H<sup>+</sup>]</span>
                                <div id="h3oDisplay" class="text-lg font-mono text-red-600">1.0000 M</div>
                            </div>
                            <div class="p-3 bg-slate-50 rounded-lg border border-slate-200">
                                <span class="text-xs font-bold text-slate-500 uppercase">[HA]</span>
                                <div id="haDisplay" class="text-lg font-mono text-slate-600">0.0000 M</div>
                            </div>
                            <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 col-span-2 text-center">
                                <span class="text-xs font-bold text-slate-500 uppercase">Degree of Ionization (<i>&alpha;</i>)</span>
                                <div id="alphaDisplay" class="text-lg font-mono text-blue-800">100.00%</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isStrongAcid = true;
        let ka = 0.0001;
        let moles = 1.0;
        let volume = 1.0;
        let molarity = 1.0;
        
        const MIN_MOLES = 1.0;
        const MAX_MOLES = 5.0;
        const MIN_VOL = 1.0;
        const MAX_VOL = 10.0;

        const MAX_UNITS = 60; 
        const particlesPerMole = 8; 
        const unitPositions = [];

        const btnStrong = document.getElementById('btnStrong');
        const btnWeak = document.getElementById('btnWeak');
        const kaSlider = document.getElementById('kaSlider');
        const kaValueDisplay = document.getElementById('kaValueDisplay');
        const equationHeader = document.getElementById('equationHeader');
        const equationDisplay = document.getElementById('equationDisplay');
        
        const molesSlider = document.getElementById('molesSlider');
        const volSlider = document.getElementById('volSlider');
        const molaritySlider = document.getElementById('molaritySlider');
        
        const molesDisplay = document.getElementById('molesDisplay');
        const volDisplay = document.getElementById('volDisplay');
        const molarityDisplay = document.getElementById('molarityDisplay');
        
        const phDisplay = document.getElementById('phDisplay');
        const h3oDisplay = document.getElementById('h3oDisplay');
        const haDisplay = document.getElementById('haDisplay');
        const alphaDisplay = document.getElementById('alphaDisplay');
        const liquidLevel = document.getElementById('liquidLevel');
        const moleculeCanvas = document.getElementById('moleculeCanvas');

        function initPositions() {
            unitPositions.length = 0;
            const cols = 6;
            const rows = 10;
            const padding = 6;
            const cellW = (100 - 2 * padding) / cols;
            const cellH = (100 - 2 * padding) / rows;

            for(let r = 0; r < rows; r++) {
                for(let c = 0; c < cols; c++) {
                    const jitterX = Math.random() * cellW;
                    const jitterY = Math.random() * cellH;
                    unitPositions.push({
                        x: padding + (c * cellW) + jitterX,
                        yFactor: (padding + (r * cellH) + jitterY) / 100
                    });
                }
            }
            unitPositions.sort(() => Math.random() - 0.5);
        }

        function createInitialDoms() {
            moleculeCanvas.innerHTML = '';
            for(let i=0; i < MAX_UNITS; i++) {
                const el = document.createElement('div');
                el.id = `unit-${i}`;
                el.className = `molecule-unit opacity-0 scale-0`;
                el.style.left = "-100px"; 
                el.innerHTML = `
                    <div class="neutral-view absolute">
                        <div class="sphere-h-neutral"></div>
                        <div class="sphere-a-neutral"></div>
                    </div>
                    <div class="ionized-view absolute" style="opacity: 0;">
                        <div class="ion-h" style="transform: translateX(0)"></div>
                        <div class="ion-a" style="transform: translateX(0)"></div>
                    </div>
                `;
                moleculeCanvas.appendChild(el);
            }
        }

        btnStrong.onclick = () => { isStrongAcid = true; updateUI(); };
        btnWeak.onclick = () => { isStrongAcid = false; updateUI(); };
        kaSlider.oninput = (e) => { ka = Math.pow(10, parseFloat(e.target.value)); updateUI(); };

        molesSlider.oninput = (e) => { 
            moles = parseFloat(e.target.value); 
            molarity = moles / volume;
            syncSliders();
            updateUI(); 
        };

        volSlider.oninput = (e) => { 
            volume = parseFloat(e.target.value); 
            molarity = moles / volume;
            syncSliders();
            updateUI(); 
        };

        molaritySlider.oninput = (e) => {
            let requestedMolarity = parseFloat(e.target.value);
            let calculatedMoles = requestedMolarity * volume;
            
            if (calculatedMoles < MIN_MOLES) {
                moles = MIN_MOLES;
                molarity = MIN_MOLES / volume;
            } else if (calculatedMoles > MAX_MOLES) {
                moles = MAX_MOLES;
                molarity = MAX_MOLES / volume;
            } else {
                molarity = requestedMolarity;
                moles = calculatedMoles;
            }
            
            syncSliders();
            updateUI();
        }

        function syncSliders() {
            molesDisplay.textContent = moles.toFixed(1);
            volDisplay.textContent = volume.toFixed(2);
            molarityDisplay.textContent = molarity.toFixed(2);
            
            molesSlider.value = moles;
            volSlider.value = volume;
            molaritySlider.value = molarity;
        }

        function updateUI() {
            if (isStrongAcid) {
                btnStrong.classList.add('bg-blue-600', 'text-white');
                btnWeak.classList.remove('bg-blue-600', 'text-white');
                document.getElementById('kaContainer').classList.add('hidden');
                equationHeader.textContent = "Ionization";
                equationDisplay.innerHTML = "HA → H<sup>+</sup> + A<sup>–</sup>";
            } else {
                btnWeak.classList.add('bg-blue-600', 'text-white');
                btnStrong.classList.remove('bg-blue-600', 'text-white');
                document.getElementById('kaContainer').classList.remove('hidden');
                kaValueDisplay.textContent = ka < 0.01 ? ka.toExponential(2) : ka.toFixed(3);
                equationHeader.textContent = "Equilibrium";
                equationDisplay.innerHTML = "HA ⇌ H<sup>+</sup> + A<sup>–</sup>";
            }

            const C = molarity; 
            const h3o = isStrongAcid ? C : ((-ka + Math.sqrt(ka*ka + 4*ka*C)) / 2);
            const ph = -Math.log10(Math.max(1e-10, h3o));
            const alpha = C > 0 ? (h3o / C) : 1;

            phDisplay.textContent = ph.toFixed(2);
            h3oDisplay.textContent = h3o.toFixed(4) + " M";
            haDisplay.textContent = Math.max(0, C - h3o).toFixed(4) + " M";
            alphaDisplay.textContent = (alpha * 100).toFixed(2) + "%";
            
            const volPercent = (volume / MAX_VOL) * 100;
            liquidLevel.style.height = volPercent + "%";

            animateParticles(alpha, volPercent);
        }

        function animateParticles(alpha, liquidHeight) {
            const totalUnitsVisible = Math.min(MAX_UNITS, Math.round(moles * particlesPerMole));
            
            for(let i=0; i < MAX_UNITS; i++) {
                const el = document.getElementById(`unit-${i}`);
                if (i < totalUnitsVisible) {
                    const pos = unitPositions[i];
                    el.style.left = `calc(${pos.x}% - 10px)`;
                    const safeBottom = Math.min(pos.yFactor * liquidHeight, liquidHeight - 4);
                    el.style.bottom = `calc(${safeBottom}% - 10px)`;
                    el.classList.remove('opacity-0', 'scale-0');
                    el.classList.add('opacity-100', 'scale-100');

                    const isIonized = (i / totalUnitsVisible) < alpha;
                    const neutralView = el.querySelector('.neutral-view');
                    const ionizedView = el.querySelector('.ionized-view');
                    const hIon = el.querySelector('.ion-h');
                    const aIon = el.querySelector('.ion-a');

                    if (isIonized) {
                        el.style.zIndex = "50";
                        neutralView.style.opacity = '0';
                        ionizedView.style.opacity = '1';
                        hIon.style.transform = 'translateX(-7px)';
                        aIon.style.transform = 'translateX(7px)';
                    } else {
                        el.style.zIndex = "10";
                        neutralView.style.opacity = '1';
                        ionizedView.style.opacity = '0';
                        hIon.style.transform = 'translateX(0)';
                        aIon.style.transform = 'translateX(0)';
                    }
                } else {
                    el.classList.add('opacity-0', 'scale-0');
                    el.style.left = "-100px";
                    el.style.zIndex = "1";
                }
            }
        }

        initPositions();
        createInitialDoms();
        syncSliders();
        updateUI();
    </script>
</body>
</html>
